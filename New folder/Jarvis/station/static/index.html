<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <title>Jarvis Station</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── PAIRING ─────────────────────────────────────────────── -->
<section id="pair" class="pair hidden">
  <div class="pair-card">
    <div class="logo">J</div>
    <h1>Jarvis Station</h1>
    <p class="muted">Enter the 6-digit PIN shown in the God Station window on your PC.</p>
    <form id="pairForm">
      <input id="pinInput" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" autocomplete="one-time-code" required>
      <input id="deviceName" placeholder="Device name (e.g. Elliot's phone)" maxlength="60">
      <button class="btn primary big" type="submit">Pair this device</button>
      <p id="pairError" class="error"></p>
    </form>
  </div>
</section>

<!-- ── MAIN APP ────────────────────────────────────────────── -->
<main id="app" class="hidden">
  <header class="topbar">
    <div class="brand"><span class="dot" id="connDot"></span><span id="hostName">God Station</span></div>
    <div class="pill" id="brainPill">brain…</div>
  </header>

  <!-- SCREEN -->
  <section class="tab" data-tab="screen">
    <div class="screen-wrap" id="screenWrap">
      <img id="screenImg" alt="PC screen" draggable="false">
      <div class="screen-msg" id="screenMsg">Connecting to your PC…</div>
    </div>
    <div class="toolbar">
      <div class="seg" id="modeSeg">
        <button data-mode="click" class="on" title="Tap = click, hold = right-click, swipe = scroll">Tap</button>
        <button data-mode="drag" title="Drag with your finger">Drag</button>
        <button data-mode="view" title="Look only — pinch to zoom">View</button>
      </div>
      <button class="icon-btn" data-scroll="3" title="Scroll up">▲</button>
      <button class="icon-btn" data-scroll="-3" title="Scroll down">▼</button>
      <button class="icon-btn" id="hdBtn" title="Sharper picture">HD</button>
      <button class="icon-btn" id="fsBtn" title="Full screen">⛶</button>
    </div>
    <form class="typebar" id="typeForm">
      <input id="typeInput" placeholder="Type on PC…" autocomplete="off" autocapitalize="off">
      <button class="btn primary" type="submit">Send</button>
    </form>
    <div class="keys" id="keysRow">
      <button data-keys="enter">Enter</button>
      <button data-keys="backspace">⌫</button>
      <button data-keys="esc">Esc</button>
      <button data-keys="tab">Tab</button>
      <button data-keys="win">⊞ Win</button>
      <button data-keys="alt,tab">Alt+Tab</button>
      <button data-keys="ctrl,c">Copy</button>
      <button data-keys="ctrl,v">Paste</button>
      <button data-keys="ctrl,z">Undo</button>
      <button data-keys="left">←</button>
      <button data-keys="up">↑</button>
      <button data-keys="down">↓</button>
      <button data-keys="right">→</button>
      <button data-keys="win,d">Desktop</button>
      <button data-keys="alt,f4">Close</button>
    </div>
  </section>

  <!-- JARVIS -->
  <section class="tab" data-tab="jarvis">
    <div class="chat-head">
      <form id="searchForm" class="search">
        <input id="searchInput" placeholder="Search everything you've said…">
        <button class="icon-btn" type="submit" title="Search memory">⌕</button>
      </form>
    </div>
    <div class="chat" id="chatLog"></div>
    <form class="chatbar" id="chatForm">
      <button type="button" class="icon-btn mic" id="micBtn" title="Talk">🎙</button>
      <input id="chatInput" placeholder="Ask Jarvis or tell it what to do…" autocomplete="off">
      <button class="btn primary" type="submit">Send</button>
    </form>
  </section>

  <!-- FILES -->
  <section class="tab" data-tab="files">
    <div class="pathbar">
      <button class="icon-btn" id="upBtn" title="Up a folder">↑</button>
      <div class="path" id="pathLabel">This PC</div>
      <label class="btn" title="Send files from your phone to this folder">Upload
        <input type="file" id="uploadInput" multiple hidden>
      </label>
    </div>
    <ul class="files" id="fileList"></ul>
  </section>

  <!-- PC -->
  <section class="tab" data-tab="pc">
    <div class="stats" id="stats"></div>

    <h2>Power</h2>
    <div class="grid">
      <button class="btn" data-power="lock">🔒 Lock</button>
      <button class="btn" data-power="sleep">🌙 Sleep</button>
      <button class="btn" data-power="restart">↻ Restart</button>
      <button class="btn danger" data-power="shutdown">⏻ Shut down</button>
      <button class="btn" data-power="cancel">✋ Cancel shutdown</button>
    </div>

    <h2>Sound &amp; media</h2>
    <div class="grid">
      <button class="btn" data-volume="down">🔉 −</button>
      <button class="btn" data-volume="mute">🔇 Mute</button>
      <button class="btn" data-volume="up">🔊 +</button>
      <button class="btn" data-media="prev">⏮</button>
      <button class="btn" data-media="playpause">⏯</button>
      <button class="btn" data-media="next">⏭</button>
    </div>

    <h2>Open</h2>
    <form class="row" id="openForm">
      <input id="openInput" placeholder="App, website or file path">
      <button class="btn primary" type="submit">Open</button>
    </form>
    <div class="chips">
      <button data-open="youtube">YouTube</button>
      <button data-open="chrome">Chrome</button>
      <button data-open="explorer">Files</button>
      <button data-open="settings">Settings</button>
      <button data-open="task manager">Task Manager</button>
    </div>

    <h2>Clipboard</h2>
    <textarea id="clipText" rows="3" placeholder="Text to send to the PC clipboard"></textarea>
    <div class="row">
      <button class="btn" id="clipGet">Get from PC</button>
      <button class="btn primary" id="clipSet">Send to PC</button>
    </div>

    <div id="shellBox">
      <h2>Terminal</h2>
      <form class="row" id="shellForm">
        <input id="shellInput" placeholder="PowerShell command" autocomplete="off" autocapitalize="off">
        <button class="btn primary" type="submit">Run</button>
      </form>
      <pre class="term" id="shellOut"></pre>
    </div>

    <h2>Running apps <button class="link" id="procRefresh">refresh</button></h2>
    <ul class="procs" id="procList"></ul>

    <h2>Paired devices</h2>
    <ul class="procs" id="deviceList"></ul>
    <button class="btn danger wide" id="unpairBtn">Unpair this device</button>
  </section>

  <nav class="tabs">
    <button data-go="screen" class="on"><span>🖥</span>Screen</button>
    <button data-go="jarvis"><span>✦</span>Jarvis</button>
    <button data-go="files"><span>🗂</span>Files</button>
    <button data-go="pc"><span>⚙</span>PC</button>
  </nav>
</main>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
