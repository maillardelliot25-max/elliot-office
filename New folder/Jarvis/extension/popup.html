<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; width: 290px; font: 14px/1.45 system-ui, "Segoe UI", sans-serif; background: #070b14; color: #e6edf9; }
    .wrap { padding: 16px; display: grid; gap: 10px; }
    .h { display: flex; gap: 10px; align-items: center; font-weight: 700; font-size: 16px; }
    .logo { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-weight: 800;
      color: #050814; background: linear-gradient(135deg, #38bdf8, #a78bfa); }
    input { width: 100%; box-sizing: border-box; background: #16203a; color: #e6edf9; border: 1px solid #22304f;
      border-radius: 9px; padding: 9px 10px; font: inherit; }
    button { font: inherit; font-weight: 600; border-radius: 9px; padding: 9px; cursor: pointer; border: 0;
      background: linear-gradient(135deg, #38bdf8, #a78bfa); color: #050814; }
    button.s { background: #16203a; color: #e6edf9; border: 1px solid #22304f; }
    .muted { color: #8a99b8; font-size: 12px; } .err { color: #f87171; min-height: 1em; font-size: 13px; }
    .ok { color: #34d399; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="h"><div class="logo">J</div>Jarvis Assist</div>
    <div id="paired" hidden>
      <p><span class="ok">●</span> Connected to your God Station.</p>
      <p class="muted">Start typing in any form — I'll highlight it and offer to fill it from your details. I never press Submit.</p>
      <button id="toggle" class="s">…</button>
      <p class="muted">Edit your details in the Jarvis app → PC → My details.</p>
      <button id="unpair" class="s">Unpair this browser</button>
    </div>
    <form id="pair" hidden>
      <p class="muted">Enter the PIN shown in the God Station window on your PC.</p>
      <input id="pin" inputmode="numeric" maxlength="6" placeholder="6-digit PIN" required>
      <input id="station" placeholder="http://localhost:8780">
      <button type="submit">Pair</button>
    </form>
    <div class="err" id="err"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
