<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local AI Chat</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e8ee; --dim:#8b93a7; --accent:#d97757; --code:#0b0d11; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 system-ui, sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:10px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header b { margin-right:auto; }
  select, button, textarea { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  select, button { padding:6px 10px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  #log { flex:1; overflow-y:auto; padding:16px; max-width:900px; width:100%; margin:0 auto; }
  .msg { margin:0 0 18px; white-space:pre-wrap; word-wrap:break-word; }
  .msg .who { font-size:12px; color:var(--dim); margin-bottom:4px; }
  .user .body { background:var(--panel); padding:10px 14px; border-radius:10px; }
  pre { background:var(--code); border:1px solid var(--line); border-radius:8px; padding:12px; overflow-x:auto; position:relative; white-space:pre; }
  pre button { position:absolute; top:6px; right:6px; font-size:12px; padding:2px 8px; }
  .err { color:#ff8a80; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); max-width:900px; width:100%; margin:0 auto; }
  textarea { flex:1; padding:10px; resize:none; height:64px; }
</style>
</head>
<body>
<header>
  <b>Local AI</b>
  <select id="model" title="Model"></select>
  <select id="mode" title="Mode">
    <option value="chat">Chat</option>
    <option value="code">Code builder</option>
  </select>
  <button id="clear">New chat</button>
</header>
<div id="log"></div>
<form id="form">
  <textarea id="input" placeholder="Ask anything… (Enter to send, Shift+Enter for new line)"></textarea>
  <button class="primary" id="send">Send</button>
</form>
<script>
const OLLAMA = "http://localhost:11434";
const PROMPTS = {
  chat: "You are a helpful, direct assistant running fully offline on the user's own computer.",
  code: "You are an expert software engineer. When asked to build something, reply with complete, runnable files in fenced code blocks, each preceded by its filename. Keep explanations short.",
};
const $ = id => document.getElementById(id);
let history = [];
try { history = JSON.parse(localStorage.getItem("history") || "[]"); } catch {}

function save() { try { localStorage.setItem("history", JSON.stringify(history)); } catch {} }

function render(text, el) {
  // Split out ``` fenced code blocks so they get their own box + copy button
  el.textContent = "";
  text.split(/```/).forEach((part, i) => {
    if (i % 2 === 0) { el.append(part); return; }
    const pre = document.createElement("pre");
    const code = part.replace(/^[\w+-]*\n/, "");
    pre.textContent = code;
    const btn = document.createElement("button");
    btn.textContent = "Copy";
    btn.onclick = () => { navigator.clipboard.writeText(code); btn.textContent = "Copied"; };
    pre.append(btn);
    el.append(pre);
  });
}

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = `<div class="who">${role === "user" ? "You" : $("model").value || "AI"}</div><div class="body"></div>`;
  render(text, div.lastChild);
  $("log").append(div);
  $("log").scrollTop = $("log").scrollHeight;
  return div.lastChild;
}

async function loadModels() {
  try {
    const r = await fetch(OLLAMA + "/api/tags");
    const { models } = await r.json();
    if (!models.length) throw new Error("No models yet. Run: ollama pull qwen3-coder:30b");
    $("model").innerHTML = models.map(m => `<option>${m.name}</option>`).join("");
    const saved = localStorage.getItem("model");
    if (saved && models.some(m => m.name === saved)) $("model").value = saved;
  } catch (e) {
    addMsg("assistant", "").innerHTML =
      `<span class="err">Can't reach Ollama at ${OLLAMA}. Make sure Ollama is running.<br>
      If it is, serve this page instead of double-clicking it:<br>
      <code>python -m http.server 8080</code> in this folder, then open http://localhost:8080/chat.html<br>(${e.message})</span>`;
  }
}

async function send(text) {
  history.push({ role: "user", content: text });
  addMsg("user", text);
  const out = addMsg("assistant", "…");
  $("send").disabled = true;
  let reply = "";
  try {
    const r = await fetch(OLLAMA + "/api/chat", {
      method: "POST",
      body: JSON.stringify({
        model: $("model").value,
        messages: [{ role: "system", content: PROMPTS[$("mode").value] }, ...history],
        stream: true,
      }),
    });
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const j = JSON.parse(line);
        if (j.error) throw new Error(j.error);
        reply += j.message?.content || "";
      }
      render(reply, out);
      $("log").scrollTop = $("log").scrollHeight;
    }
    history.push({ role: "assistant", content: reply });
    save();
  } catch (e) {
    out.innerHTML = `<span class="err">Error: ${e.message}</span>`;
    history.pop();
  }
  $("send").disabled = false;
}

$("form").onsubmit = e => {
  e.preventDefault();
  const t = $("input").value.trim();
  if (t && !$("send").disabled) { $("input").value = ""; send(t); }
};
$("input").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } };
$("model").onchange = () => { try { localStorage.setItem("model", $("model").value); } catch {} };
$("clear").onclick = () => { history = []; save(); $("log").innerHTML = ""; };

history.forEach(m => addMsg(m.role, m.content));
loadModels();
</script>
</body>
</html>
