plugins {
    id 'com.android.application'
}

// Release signing comes from GitHub secrets (see .github/workflows/android.yml).
// The same permanent key signs every build, so each new Friday.apk installs over the last one.
def ksFile = System.getenv('FRIDAY_KEYSTORE_FILE')
def ksPass = System.getenv('FRIDAY_KEYSTORE_PASSWORD')
def haveReleaseKey = ksFile && ksPass && file(ksFile).exists()

// versionCode goes up on every CI run, so Android always treats a new build as an update.
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0') as int

android {
    namespace 'com.maillard.friday'
    compileSdk 36

    defaultConfig {
        applicationId 'ai.maillard.friday'
        minSdk 29          // Android 10+: needed for the assistant's screen-reading API
        targetSdk 36       // Google Play's current target-API requirement (Android 16)
        versionCode 100 + runNumber
        versionName "2.0.${runNumber}"
    }

    signingConfigs {
        if (haveReleaseKey) {
            release {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias 'friday'
                keyPassword ksPass
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Without the release key (e.g. a fork or a test run) the build is signed with a
            // throwaway debug key and the workflow refuses to publish it.
            signingConfig haveReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds true
    }
}
