<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elliot AI</title>
<style>
  :root {
    --bg:#faf9f5; --side:#f0eee6; --panel:#ffffff; --line:#e3e0d6; --text:#1f1e1d; --dim:#73726c;
    --accent:#c96442; --accent-text:#fff; --code:#f5f4ef; --user:#ece9df; --danger:#b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#262624; --side:#1f1e1d; --panel:#30302e; --line:#3e3e3a; --text:#ecebe6; --dim:#a6a59f;
      --code:#1c1c1a; --user:#3a3936; --danger:#ff8a80;
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.6 ui-sans-serif, system-ui, "Segoe UI", sans-serif; display:flex; overflow:hidden; }
  button, select, input, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; background:none; border:1px solid var(--line); border-radius:8px; padding:5px 10px; }
  button:hover { background:var(--user); }
  button:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-text); }
  button.icon { border:none; padding:4px 8px; color:var(--dim); }
  select { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:5px 8px; }

  /* Sidebar */
  #side { width:270px; background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; flex-shrink:0; }
  #side .brand { font-weight:600; font-size:17px; padding:14px 16px 8px; display:flex; align-items:center; gap:8px; }
  #side .brand span { width:22px; height:22px; border-radius:6px; background:var(--accent); display:inline-block; }
  .sidePad { padding:0 12px 8px; display:flex; gap:6px; }
  .sidePad > * { flex:1; min-width:0; }
  #newChat { text-align:left; }
  #search { border:1px solid var(--line); border-radius:8px; padding:5px 10px; background:var(--panel); }
  #chatList { flex:1; overflow-y:auto; padding:0 8px; }
  .chatItem { display:flex; align-items:center; border-radius:8px; padding:6px 8px; cursor:pointer; color:var(--dim); font-size:14px; }
  .chatItem:hover, .chatItem.active { background:var(--user); color:var(--text); }
  .chatItem .t { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chatItem .acts { display:none; }
  .chatItem:hover .acts { display:flex; }
  .chatItem .acts button { border:none; padding:0 4px; color:var(--dim); font-size:13px; }
  #side .bottom { padding:10px 12px; border-top:1px solid var(--line); }

  /* Main */
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #top { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--line); }
  #menuBtn { display:none; }
  #title { flex:1; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #model { max-width:230px; }
  #log { flex:1; overflow-y:auto; }
  #log .inner { max-width:780px; margin:0 auto; padding:24px 16px 40px; }
  .welcome { text-align:center; margin-top:14vh; color:var(--dim); }
  .welcome h1 { color:var(--text); font-weight:500; font-size:30px; margin:0 0 8px; }
  .ideas { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:22px; }
  .ideas button { font-size:13px; color:var(--dim); background:var(--panel); }
  .userWrap { display:flex; flex-direction:column; align-items:flex-end; margin:20px 0; }
  .user-msg { background:var(--user); border-radius:14px; padding:10px 14px; max-width:85%; white-space:pre-wrap; word-wrap:break-word; }
  .user-msg img { max-width:220px; max-height:220px; border-radius:8px; display:block; margin-bottom:6px; }
  .user-msg textarea { width:min(600px, 70vw); min-height:80px; border:1px solid var(--line); border-radius:8px; padding:8px; background:var(--panel); }
  .userWrap .msgActs { margin:4px 0 0; opacity:0; }
  .userWrap:hover .msgActs { opacity:1; }
  .chip { display:inline-block; font-size:12px; border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:1px 8px; margin:0 4px 6px 0; }
  .ai { margin:0 0 8px; word-wrap:break-word; }
  .ai p { margin:0 0 12px; }
  .ai h2, .ai h3, .ai h4, .ai h5 { margin:18px 0 8px; line-height:1.3; }
  .ai ul, .ai ol { margin:0 0 12px; padding-left:24px; }
  .ai table { border-collapse:collapse; margin:0 0 12px; display:block; overflow-x:auto; }
  .ai th, .ai td { border:1px solid var(--line); padding:4px 10px; }
  .ai blockquote { border-left:3px solid var(--line); margin:0 0 12px; padding-left:12px; color:var(--dim); }
  .ai a { color:var(--accent); }
  .media { margin:0 0 12px; display:flex; flex-wrap:wrap; gap:10px; }
  .media figure { margin:0; position:relative; }
  .media img, .media video { max-width:100%; max-height:520px; border-radius:12px; display:block; border:1px solid var(--line); cursor:zoom-in; }
  .media figure a { position:absolute; top:8px; right:8px; background:rgba(0,0,0,.6); color:#fff; border-radius:6px; padding:2px 8px; font-size:12px; text-decoration:none; }
  code { font:13px/1.5 ui-monospace, Consolas, monospace; background:var(--code); border-radius:4px; padding:1px 4px; }
  .codeblock { border:1px solid var(--line); border-radius:10px; margin:0 0 12px; overflow:hidden; background:var(--code); }
  .codeblock .bar { display:flex; align-items:center; gap:6px; padding:4px 8px 4px 12px; font-size:12px; color:var(--dim); border-bottom:1px solid var(--line); }
  .codeblock .bar span { flex:1; }
  .codeblock .bar button { font-size:12px; padding:1px 8px; }
  .codeblock pre { margin:0; padding:12px; overflow-x:auto; max-height:420px; }
  .codeblock pre code { background:none; padding:0; }
  details.think { color:var(--dim); font-size:14px; margin:0 0 10px; border-left:2px solid var(--line); padding-left:10px; }
  details.think summary { cursor:pointer; }
  details.think div { white-space:pre-wrap; }
  .tool { border:1px solid var(--line); border-radius:10px; margin:0 0 10px; font-size:13px; background:var(--panel); }
  .tool summary { padding:6px 10px; cursor:pointer; color:var(--dim); }
  .tool summary b { color:var(--text); font-weight:500; }
  .tool pre { margin:0; padding:8px 10px; border-top:1px solid var(--line); max-height:260px; overflow:auto; white-space:pre-wrap; font:12px/1.5 ui-monospace, Consolas, monospace; }
  .tool .status { padding:6px 10px; border-top:1px solid var(--line); color:var(--accent); }
  .approve { display:flex; gap:8px; align-items:center; padding:8px 10px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .approve span { flex:1; color:var(--text); }
  .msgActs { display:flex; gap:4px; margin:-4px 0 10px; }
  .msgActs button { border:none; color:var(--dim); font-size:12px; padding:2px 6px; }
  .err { color:var(--danger); }
  .statusLine { color:var(--dim); font-size:14px; margin:0 0 10px; }
  .cursor::after { content:"▍"; animation:blink 1s steps(2) infinite; color:var(--accent); }
  @keyframes blink { 50% { opacity:0; } }

  /* Composer */
  #composer { max-width:780px; width:100%; margin:0 auto; padding:0 16px 16px; }
  #modes { display:flex; gap:4px; margin-bottom:6px; }
  #modes button { border:none; font-size:13px; color:var(--dim); border-radius:20px; padding:3px 12px; }
  #modes button.on { background:var(--user); color:var(--text); font-weight:500; }
  #box { border:1px solid var(--line); border-radius:16px; background:var(--panel); padding:10px 12px; box-shadow:0 2px 10px rgba(0,0,0,.04); }
  #box.drag { border-color:var(--accent); }
  #attachments { display:flex; flex-wrap:wrap; gap:6px; }
  #attachments .att { position:relative; font-size:12px; border:1px solid var(--line); border-radius:8px; padding:3px 22px 3px 8px; margin-bottom:6px; }
  #attachments img { height:48px; border-radius:6px; display:block; }
  #attachments .att.img { padding:2px; }
  #attachments .x { position:absolute; top:-6px; right:-6px; border-radius:50%; width:18px; height:18px; padding:0; font-size:11px; background:var(--panel); }
  #input { width:100%; border:none; outline:none; resize:none; background:none; max-height:240px; min-height:28px; }
  #row { display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  #row .spacer { flex:1; }
  .toggle { font-size:13px; color:var(--dim); padding:4px 8px; }
  .toggle.on { color:var(--accent); border-color:var(--accent); }
  #mic.on { color:#fff; background:var(--danger); border-color:var(--danger); }
  .hint { font-size:12px; color:var(--dim); text-align:center; margin-top:6px; }

  /* Artifact panel */
  #art { width:46%; max-width:900px; border-left:1px solid var(--line); background:var(--panel); display:none; flex-direction:column; }
  #art.open { display:flex; }
  #art .bar { display:flex; gap:6px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  #art .bar .name { flex:1; font-weight:500; }
  #art iframe { flex:1; border:none; background:#fff; width:100%; }
  #art pre { flex:1; margin:0; padding:12px; overflow:auto; background:var(--code); font:13px/1.5 ui-monospace, Consolas, monospace; }

  /* Modals */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:10; padding:16px; }
  .modal.open { display:flex; }
  .modal .card { background:var(--panel); border-radius:14px; padding:20px; width:580px; max-width:100%; max-height:90vh; overflow-y:auto; }
  .modal h3 { margin:22px 0 0; font-size:15px; }
  .modal label { display:block; font-size:13px; color:var(--dim); margin:12px 0 4px; }
  .modal input[type=text], .modal input[type=password], .modal textarea, .modal select { width:100%; border:1px solid var(--line); border-radius:8px; padding:8px; background:var(--bg); }
  .modal textarea { min-height:90px; }
  .modal .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
  .fileList .chip { cursor:default; }
  .fileList .chip button { border:none; padding:0 0 0 4px; font-size:11px; }
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:30; cursor:zoom-out; }
  #lightbox img { max-width:95vw; max-height:95vh; }
  #toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:8px 14px; border-radius:8px; font-size:14px; display:none; z-index:40; max-width:90vw; }

  @media (max-width: 800px) {
    #side { position:fixed; inset:0 auto 0 0; z-index:5; transform:translateX(-100%); transition:transform .2s; }
    #side.open { transform:none; }
    #menuBtn { display:inline-block; }
    #art.open { position:fixed; inset:0; width:100%; max-width:none; z-index:6; }
    #model { max-width:150px; }
  }
</style>
</head>
<body>
<nav id="side">
  <div class="brand"><span></span>Elliot AI</div>
  <div class="sidePad">
    <select id="project" title="Project"></select>
    <button id="projectSettings" title="Project settings" style="flex:0">⚙</button>
  </div>
  <div class="sidePad"><button id="newChat">＋ New chat</button></div>
  <div class="sidePad"><input id="search" placeholder="Search chats"></div>
  <div id="chatList"></div>
  <div class="bottom"><button id="openSettings" style="width:100%">⚙ Settings, memory &amp; keys</button></div>
</nav>

<main id="main">
  <div id="top">
    <button id="menuBtn" class="icon">☰</button>
    <div id="title"></div>
    <button class="icon" id="export" title="Export chat as Markdown">⤓</button>
    <select id="model" title="Model"></select>
  </div>
  <div id="log"><div class="inner" id="inner"></div></div>
  <div id="composer">
    <div id="modes">
      <button data-mode="chat" class="on">💬 Chat</button>
      <button data-mode="image">🎨 Create image</button>
      <button data-mode="video">🎬 Create video</button>
    </div>
    <div id="box">
      <div id="attachments"></div>
      <textarea id="input" rows="1"></textarea>
      <div id="row">
        <button class="icon" id="attach" title="Attach images, PDFs, documents or code">📎</button>
        <input type="file" id="file" multiple hidden>
        <button class="icon" id="mic" title="Speak instead of typing">🎤</button>
        <span id="chatOpts">
          <button class="toggle" id="toolsBtn" title="Let the AI read/write files, run code, search the web and make images">🛠 Tools</button>
          <button class="toggle" id="thinkBtn" title="Think step by step before answering (thinking models)">💭 Think</button>
          <button class="toggle" id="researchBtn" title="Deep research: many web searches, then a cited report">🔎 Research</button>
        </span>
        <select id="aspect" title="Shape" hidden>
          <option value="1:1">Square 1:1</option><option value="16:9">Wide 16:9</option><option value="9:16">Tall 9:16</option>
          <option value="4:3">4:3</option><option value="3:4">3:4</option><option value="3:2">3:2</option><option value="2:3">2:3</option><option value="21:9">Cinema 21:9</option>
        </select>
        <button class="toggle" id="speakBtn" title="Read answers out loud">🔊</button>
        <div class="spacer"></div>
        <button class="primary" id="send">Send</button>
      </div>
    </div>
    <div class="hint" id="hint">Chat runs 100% on your computer. Local models can make mistakes.</div>
  </div>
</main>

<aside id="art">
  <div class="bar">
    <span class="name" id="artName">Artifact</span>
    <button id="artToggle">Code</button>
    <button id="artCopy">Copy</button>
    <button id="artDownload">Download</button>
    <button id="artSave">Save to workspace</button>
    <button class="icon" id="artClose">✕</button>
  </div>
  <iframe id="artFrame" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
  <pre id="artCode" hidden></pre>
</aside>

<div class="modal" id="settings">
  <div class="card">
    <h2 style="margin:0">Settings</h2>
    <label>Your name</label>
    <input type="text" id="sName">
    <label>Custom instructions (how the AI should respond, in every chat)</label>
    <textarea id="sInstr" placeholder="e.g. Keep answers short. I run Maillard AI, a freelance AI agency."></textarea>
    <label>Memory (one fact per line; the AI also adds to this itself)</label>
    <textarea id="sMem"></textarea>
    <h3>Image &amp; video generation</h3>
    <label>Google AI Studio key: free at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a></label>
    <input type="password" id="sKey" placeholder="AIza…" autocomplete="off">
    <label>Image generator</label>
    <select id="sProvider">
      <option value="gemini">Google Gemini (Nano Banana): best quality, needs key + internet</option>
      <option value="local">Local Stable Diffusion (Forge / AUTOMATIC1111): free, offline</option>
    </select>
    <label>Gemini image model</label>
    <select id="sImgModel">
      <option value="gemini-3.1-flash-image">Nano Banana 2 (gemini-3.1-flash-image): fast, great</option>
      <option value="gemini-3-pro-image">Nano Banana Pro (gemini-3-pro-image): best quality, text in images</option>
      <option value="gemini-nano-banana-2.1">Nano Banana 2.1 (gemini-nano-banana-2.1): newest</option>
      <option value="gemini-3.1-flash-lite-image">Nano Banana 2 Lite: cheapest</option>
    </select>
    <label>Video model</label>
    <input type="text" id="sVidModel" placeholder="veo-3.1-generate-preview">
    <label>Local image server address</label>
    <input type="text" id="sLocal" placeholder="http://127.0.0.1:7860">
    <h3>Tools</h3>
    <label>Workspace folder (where Tools mode reads, writes and runs files)</label>
    <input type="text" id="sWs">
    <label><input type="checkbox" id="sAuto"> Auto-approve file writes, commands and videos (no permission prompts)</label>
    <div class="actions">
      <button id="sCancel">Cancel</button>
      <button class="primary" id="sSave">Save</button>
    </div>
  </div>
</div>

<div class="modal" id="projModal">
  <div class="card">
    <h2 style="margin:0" id="projHead">Project</h2>
    <label>Name</label>
    <input type="text" id="pName" placeholder="e.g. Maillard AI website">
    <label>Project instructions (apply to every chat in this project)</label>
    <textarea id="pInstr" placeholder="e.g. You're helping build my agency site. Use my brand colours #c96442 and cream."></textarea>
    <label>Project knowledge (files every chat in this project can read)</label>
    <div class="fileList" id="pFiles"></div>
    <button id="pAdd">📎 Add files</button>
    <input type="file" id="pFile" multiple hidden>
    <div class="actions">
      <button id="pDelete" style="margin-right:auto;color:var(--danger)">Delete project</button>
      <button id="pCancel">Cancel</button>
      <button class="primary" id="pSave">Save</button>
    </div>
  </div>
</div>
<div id="lightbox"><img alt=""></div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PREVIEW = ["html", "svg", "xml", "jsx", "tsx", "react", "mermaid", "markdown", "md"];
let chatId = null, models = [], busy = false, controller = null, pending = [], settings = {}, projects = [], allChats = [];
let mode = "chat";
let tools = pref("tools", true), think = pref("think", false), research = false, speak = pref("speak", false);
let projectId = pref("project", "");

function pref(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }
function setPref(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 4000); }
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts, body: opts.body && JSON.stringify(opts.body) });
  const j = await r.json();
  if (j && j.error) throw new Error(j.error);
  return j;
}

// ── Markdown ──────────────────────────────────────────────────────────
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mediaHtml(urls) {
  return `<div class="media">${urls.map(u => {
    const v = /\.(mp4|webm|mov)$/i.test(u);
    return `<figure>${v ? `<video src="${u}" controls loop playsinline></video>` : `<img src="${u}" alt="Generated image">`}<a href="${u}" download>Download</a></figure>`;
  }).join("")}</div>`;
}
const MEDIA_RE = /!\[[^\]]*\]\((\/media\/[\w.-]+)\)/g;
function blocks(text) {
  const lines = text.split("\n"), out = [];
  let i = 0;
  while (i < lines.length) {
    const raw = lines[i], l = esc(raw);
    if (!raw.trim()) { i++; continue; }
    let m;
    if (/^\s*!\[[^\]]*\]\(\/media\//.test(raw)) {
      const urls = [];
      while (i < lines.length && /^\s*!\[[^\]]*\]\(\/media\//.test(lines[i])) urls.push(...[...lines[i++].matchAll(MEDIA_RE)].map(x => x[1]));
      out.push(mediaHtml(urls)); continue;
    }
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { out.push(`<h${m[1].length + 1}>${inline(m[2])}</h${m[1].length + 1}>`); i++; continue; }
    if (/^(-{3,}|\*{3,})$/.test(raw.trim())) { out.push("<hr>"); i++; continue; }
    if (/^\s*([-*+]|\d+[.)])\s/.test(raw)) {
      const ordered = /^\s*\d/.test(raw), items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s/.test(lines[i])) items.push(esc(lines[i++]).replace(/^\s*([-*+]|\d+[.)])\s/, ""));
      out.push(`<${ordered ? "ol" : "ul"}>${items.map(x => `<li>${inline(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`);
      continue;
    }
    if (/^>/.test(raw)) {
      const q = [];
      while (i < lines.length && /^>/.test(lines[i])) q.push(esc(lines[i++].replace(/^>\s?/, "")));
      out.push(`<blockquote>${inline(q.join("<br>"))}</blockquote>`);
      continue;
    }
    if (raw.includes("|") && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      const cells = r => esc(r).trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      const head = cells(raw); i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes("|")) rows.push(cells(lines[i++]));
      out.push(`<table><tr>${head.map(c => `<th>${c}</th>`).join("")}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`);
      continue;
    }
    const p = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|\s*([-*+]|\d+[.)])\s|>|\s*!\[[^\]]*\]\(\/media\/)/.test(lines[i])) p.push(esc(lines[i++]));
    if (p.length) out.push(`<p>${inline(p.join("<br>")).replace(MEDIA_RE, (_, u) => mediaHtml([u]))}</p>`); else i++;
  }
  return out.join("");
}
const codeStore = {};
function canPreview(a) { return PREVIEW.includes(a.lang) || /^\s*<(!doctype|html|svg)/i.test(a.code); }
function markdown(text) {
  const parts = text.split(/^```/m);
  let html = "";
  parts.forEach((part, i) => {
    if (i % 2 === 0) { html += blocks(part); return; }
    const nl = part.indexOf("\n");
    const lang = (nl < 0 ? part : part.slice(0, nl)).trim().toLowerCase();

  });
  return html;
}

input.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("send").click(); } };
$("send").onclick = () => {
  if (busy) { stop(); return; }
  const text = input.value.trim();
  if (!text && !pending.length) return;
  if (mode !== "chat" && !text) { toast("Describe what to create"); return; }
  rec?.stop();
  run({
    content: text,
    images: pending.filter(p => p.kind === "image").map(p => p.data),
    files: pending.filter(p => p.kind === "file").map(p => ({ name: p.name, text: p.text })),
  });
  input.value = ""; input.oninput(); pending = []; drawAttachments();
};

// ── Sending & streaming ───────────────────────────────────────────────
async function stop() {
  if (chatId) await api("/api/stop", { method: "POST", body: { chat_id: chatId } }).catch(() => {});
  controller?.abort();
}
function setBusy(on) { busy = on; $("send").textContent = on ? "■ Stop" : "Send"; }

async function run(message, { retry = false, editIndex } = {}) {
  const gen = mode !== "chat" && !retry;
  let model = $("model").value;
  if (!gen && !model) { toast("No model selected. Install one with: ollama pull qwen3-coder:30b"); return; }

  let chat = null;
  if (retry || editIndex !== undefined) {
    chat = await api(`/api/chats/${chatId}`);
    if (editIndex !== undefined) chat.messages.splice(editIndex);
    while (retry && chat.messages.length && chat.messages.at(-1).role !== "user") chat.messages.pop();
  }
  if (!gen) {
    const hasImages = message?.images?.length || (retry && chat.messages.some(m => m.images?.length));
    if (hasImages && !caps(model).includes("vision")) {
      const v = models.find(m => m.caps.includes("vision"));
      if (v) { model = v.name; toast(`Using ${v.name} to look at your image`); }
      else toast("This model can't see images. Install one: ollama pull qwen3-vl:8b");
    }
    if ((tools || research) && !caps(model).includes("tools")) toast(`${model} doesn't support tools, so answering without them`);
  }

  if (chat) renderChat(chat); else if (!chatId) inner.innerHTML = "";
  if (message) userBubble({ ...message, display: message.content, files: message.files.map(f => f.name) });
  scrollDown(true);
  setBusy(true);
  window.speechSynthesis?.cancel();
  controller = new AbortController();

  let seg = null, thinkEl = null, cards = {}, lastText = "", spoken = "";
  const status = document.createElement("div"); status.className = "statusLine cursor"; inner.append(status);
  if (gen) status.textContent = mode === "video" ? "Starting video… " : "Creating image… ";
  const flush = () => { if (seg) { seg.el.innerHTML = markdown(seg.text); seg.el.classList.add("cursor"); } };
  let raf = 0;
  const schedule = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; flush(); scrollDown(); }); };
  const endSeg = () => { if (seg) { seg.el.innerHTML = markdown(seg.text); seg.el.classList.remove("cursor"); lastText = seg.text || lastText; spoken += seg.text + " "; } seg = null; thinkEl = null; };

  try {
    const body = gen
      ? { chat_id: chatId, project_id: projectId || null, message, kind: mode, aspect_ratio: $("aspect").value, edit_index: editIndex }
      : { chat_id: chatId, project_id: projectId || null, model, message, tools, think, research, retry, edit_index: editIndex };
    const r = await fetch(gen ? "/api/generate" : "/api/chat", {
      method: "POST", signal: controller.signal, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "status" && !ev.id) { status.textContent = ev.text + " "; continue; }
        if (ev.type !== "chat") status.remove();
        if (ev.type === "chat") {
          const isNew = chatId !== ev.id;
          chatId = ev.id; $("title").textContent = ev.title;
          if (isNew) refreshChats();
        } else if (ev.type === "thinking") {
          if (!thinkEl) thinkEl = thinkBlock("", true);
          thinkEl.lastChild.textContent += ev.delta; scrollDown();
        } else if (ev.type === "text") {
          if (thinkEl) { thinkEl.open = false; thinkEl = null; }
          if (!seg) seg = { el: aiBlock(), text: "" };
          seg.text += ev.delta; schedule();
        } else if (ev.type === "tool_call") {
          endSeg();
          cards[ev.id] = toolCard(ev.name, ev.args); cards[ev.id].open = true; scrollDown();
        } else if (ev.type === "status") {
          const c = cards[ev.id];
          let s = c.querySelector(".status");
          if (!s) { s = document.createElement("div"); s.className = "status"; c.append(s); }
          s.textContent = ev.text;
        } else if (ev.type === "approval") {
          approvalBar(ev.id, cards[ev.id]);
        } else if (ev.type === "tool_result") {
          const c = cards[ev.id];
          c.querySelector(".approve")?.remove();
          setResult(c, ev.output); c.open = false; scrollDown(true);
        } else if (ev.type === "error") {
          endSeg(); inner.insertAdjacentHTML("beforeend", `<p class="err">⚠ ${esc(ev.message)}</p>`);
        }
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") inner.insertAdjacentHTML("beforeend", `<p class="err">⚠ ${esc(e.message)}</p>`);
  }
  status.remove();
  endSeg();
  setBusy(false);
  // Re-render from what was saved so edit/retry buttons line up with the stored messages
  if (chatId) { try { renderChat(await api(`/api/chats/${chatId}`)); } catch {} }
  scrollDown(true);
  if (speak && spoken.trim() && !gen) say(spoken);
  // Like Claude: pop open the newest web page / app / diagram the AI just made
  const last = Object.keys(codeStore).reverse().find(id => canPreview(codeStore[id]) && lastText.includes(codeStore[id].code));
  if (last && codeStore[last].code.length > 200) openArtifact(last);
}

function approvalBar(id, card) {
  const d = document.createElement("div");
  d.className = "approve";
  d.innerHTML = `<span>Allow this action?</span><button class="primary">Allow</button><button>Always allow</button><button>Deny</button>`;
  const [allow, always, deny] = d.querySelectorAll("button");
  const answer = (ok, all) => { d.innerHTML = `<span>${ok ? "Allowed" : "Denied"}</span>`; api("/api/approve", { method: "POST", body: { id, allow: ok, always: all } }); if (all) settings.auto_approve = true; };
  allow.onclick = () => answer(true, false);
  always.onclick = () => answer(true, true);
  deny.onclick = () => answer(false, false);
  card.append(d); card.open = true; scrollDown(true);
}

// ── Settings ──────────────────────────────────────────────────────────
function fillSettings(s) {
  $("sName").value = s.name || ""; $("sInstr").value = s.instructions || "";
  $("sMem").value = (s.memory || []).join("\n"); $("sWs").value = s.workspace || "";
  $("sAuto").checked = !!s.auto_approve; $("sKey").value = s.google_api_key || "";
  $("sProvider").value = s.image_provider || "gemini"; $("sVidModel").value = s.video_model || ""; $("sLocal").value = s.local_image_url || "";
  if (s.image_model && ![...$("sImgModel").options].some(o => o.value === s.image_model)) $("sImgModel").add(new Option(s.image_model, s.image_model));
  if (s.image_model) $("sImgModel").value = s.image_model;
}
$("openSettings").onclick = async () => {
  fillSettings(settings);
  $("settings").classList.add("open");
  try { settings = await api("/api/settings"); fillSettings(settings); } catch {}
};
$("sCancel").onclick = () => $("settings").classList.remove("open");
$("sSave").onclick = async () => {
  try {
    settings = await api("/api/settings", { method: "POST", body: {
      name: $("sName").value.trim(), instructions: $("sInstr").value,
      memory: $("sMem").value.split("\n").map(s => s.trim()).filter(Boolean),
      workspace: $("sWs").value.trim(), auto_approve: $("sAuto").checked,
      google_api_key: $("sKey").value.trim(), image_provider: $("sProvider").value,
      image_model: $("sImgModel").value, video_model: $("sVidModel").value.trim() || "veo-3.1-generate-preview",
      local_image_url: $("sLocal").value.trim() || "http://127.0.0.1:7860",
    }});
    $("settings").classList.remove("open"); toast("Settings saved");
    if (!chatId) welcome();
  } catch (e) { toast(e.message); }
};
document.querySelectorAll(".modal").forEach(m => m.addEventListener("click", e => { if (e.target === m) m.classList.remove("open"); }));

(async () => {
  try { settings = await api("/api/settings"); } catch {}
  drawToggles();
  try { await refreshProjects(); } catch {}
  setMode("chat");
  await loadModels();
  refreshChats();
  input.focus();
})();
</script>
