<!doctype html><html><head><meta charset="utf-8"><title>Friday</title>
<style>html,body{margin:0;height:100%;background:#070b14;color:#e6edf9;font:15px system-ui,"Segoe UI",sans-serif}
body{display:grid;place-items:center}.c{text-align:center}.logo{width:84px;height:84px;margin:0 auto 18px;border-radius:22px;
background:linear-gradient(135deg,#a78bfa,#f472b6);display:grid;place-items:center;font:italic 900 46px "Segoe UI",sans-serif;color:#070b14;

<body><div class="c"><div class="logo">F</div><h2>Starting Friday…</h2><p id="m">Waking up Friday's brain on this PC.</p></div>
