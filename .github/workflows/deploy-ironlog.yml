name: Deploy IronLog to GitHub Pages

on:
  push:
    branches: [claude/symmetry-copy-paste-app-mma485]
    paths:
      - "ironlog/**"
      - ".github/workflows/deploy-ironlog.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ironlog/package-lock.json

      - name: Install dependencies
        working-directory: ironlog
        run: npm ci

      - name: Run tests
        working-directory: ironlog
        run: npx vitest run

      - name: Build
        working-directory: ironlog
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ironlog/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
