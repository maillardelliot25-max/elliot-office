# Builds Friday-Setup.exe (Windows desktop app: own window, tray, keeps Friday and Jarvis running),
# installs and launches it on a real Windows runner as a test, then publishes it on "friday-desktop".
name: Build Friday desktop app

on:
  push:
    paths:
      - "New folder/LocalAI/desktop/**"
      - "New folder/LocalAI/app/**"
      - "New folder/LocalAI/install-and-start.ps1"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Friday-Setup.exe
        working-directory: New folder/LocalAI/desktop/electron
        run: |
          npm install --no-audit --no-fund
          npm run dist
          # Jarvis's own app: same code, built as "Jarvis" (own name, icon, Start entry and install folder)
          npx electron-builder --win nsis --publish never `
            -c.extraMetadata.name=jarvis-desktop -c.extraMetadata.productName=Jarvis -c.productName=Jarvis `
            -c.appId=ai.maillard.jarvis.desktop -c.artifactName=Jarvis-Setup.exe -c.win.icon=assets/jarvis.ico `
            -c.nsis.shortcutName=Jarvis
          Get-Item dist\Friday-Setup.exe, dist\Jarvis-Setup.exe | Select-Object Name, Length

      - name: Sign (only if a code-signing certificate is configured)
        if: ${{ env.SIGN_PFX != '' }}
        env:
          SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX_B64 }}
          SIGN_PW: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $st sign /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PW /fd sha256 /tr http://timestamp.digicert.com /td sha256 "New folder\LocalAI\desktop\electron\dist\Friday-Setup.exe"

      - name: Test - install silently, launch, Friday's server comes up
        run: |
          python -m pip install --quiet anthropic openai pypdf pillow psutil
          Start-Process "New folder\LocalAI\desktop\electron\dist\Friday-Setup.exe" -ArgumentList "/S" -Wait
          $exe = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Friday.exe -Depth 2 | Select-Object -First 1).FullName
          if (-not $exe) { throw "Friday.exe wasn't installed" }
          "Installed: $exe"
          if (-not (Test-Path (Join-Path (Split-Path $exe) "resources\LocalAI\app\server.py"))) { throw "Friday's files weren't bundled" }
          if (-not (Test-Path "$env:USERPROFILE\Desktop\Friday.lnk")) { "Note: no desktop shortcut found (runner profile)" }
          Get-Process Friday -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Process $exe -ArgumentList "--hidden"
          $ok = $false
          foreach ($i in 1..90) { try { Invoke-WebRequest http://127.0.0.1:8765 -UseBasicParsing -TimeoutSec 2 | Out-Null; $ok = $true; break } catch { Start-Sleep 1 } }
          Get-Content "$env:APPDATA\Friday\friday-desktop.log" -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$env:APPDATA\Friday\friday-server.log" -Tail 40 -ErrorAction SilentlyContinue; throw "Friday didn't start" }
          "Friday desktop app started Friday's server"
          Start-Process "New folder\LocalAI\desktop\electron\dist\Jarvis-Setup.exe" -ArgumentList "/S" -Wait
          $jexe = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Jarvis.exe -Depth 2 | Select-Object -First 1).FullName
          if (-not $jexe) { throw "Jarvis.exe wasn't installed" }
          "Installed: $jexe"
          Start-Process $jexe; Start-Sleep 10
          if (-not (Get-Process Jarvis -ErrorAction SilentlyContinue)) { throw "Jarvis app didn't stay running" }
          "Jarvis desktop app runs"
          Get-Process Friday, python -ErrorAction SilentlyContinue | Stop-Process -Force

      - uses: actions/upload-artifact@v4
        with:
          name: friday-desktop
          path: |
            New folder/LocalAI/desktop/electron/dist/Friday-Setup.exe
            New folder/LocalAI/desktop/electron/dist/Jarvis-Setup.exe

      - name: Publish on the friday-desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          **Friday for Windows**: Friday in her own window with a tray icon. It keeps Friday and Jarvis running all the time and stops the PC from sleeping.

          1. Download **Friday-Setup.exe** and open it. It installs in a few seconds and opens Friday.
          2. If Windows shows "Windows protected your PC", click **More info** → **Run anyway** (the app isn't code-signed yet).
          3. Friday starts every time you sign in. Closing the window sends it to the tray (bottom-right). Right-click the tray icon for Jarvis and settings.
          "@ | Set-Content notes.md
          gh release view friday-desktop *> $null; if ($LASTEXITCODE -ne 0) { gh release create friday-desktop --title "Friday for Windows" --notes-file notes.md }
          gh release edit friday-desktop --title "Friday for Windows" --notes-file notes.md
          gh release upload friday-desktop "New folder\LocalAI\desktop\electron\dist\Friday-Setup.exe" --clobber
          gh release view jarvis-desktop *> $null; if ($LASTEXITCODE -ne 0) { gh release create jarvis-desktop --title "Jarvis for Windows" --notes "Jarvis in his own window with a tray icon. Starts with Windows and keeps Jarvis (and Friday) running. Download Jarvis-Setup.exe and open it." }
          gh release upload jarvis-desktop "New folder\LocalAI\desktop\electron\dist\Jarvis-Setup.exe" --clobber
